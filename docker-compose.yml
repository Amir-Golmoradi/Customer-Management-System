services:
  api:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:secure-password@db:5432/customers?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure-password
      POSTGRES_DB: customers
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./internal/database/sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

volumes:
  db_data:
